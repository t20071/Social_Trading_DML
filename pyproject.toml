[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "social-trading-dml"
version = "3.2.0"
description = "Causal machine learning analysis of self-trading intensity and trader gains on a social trading platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<2.3",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "econml>=0.15",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ipykernel>=6.25", "nbformat>=5.9", "nbconvert>=7.0"]

[project.scripts]
social-trading-dml = "social_trading_dml.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # econml replaces LassoCV's own inner `cv` with its default
    "ignore:Model LassoCV.*non-default cv attribute:UserWarning",
]
